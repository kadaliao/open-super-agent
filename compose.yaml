# 一键部署：cp .env.example .env（DEEPSEEK_API_KEY 可以先填，也可以之后在 设置 → 模型 里填），然后 docker compose up -d，打开 http://127.0.0.1:8765
# 可选项（端口、HTTPS、Instabox、国内镜像源）见 docs/docker.md
name: osa

services:
  osa:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PYPI_INDEX: ${PYPI_INDEX:-}
    image: open-super-agent:local
    pull_policy: never    # 镜像只在本机构建，不去 Docker Hub 找
    init: true            # 应用（MCP）是子进程，退出后要有人回收
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}                         # 定时任务按这个时区算
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}   # 默认只有本机能连进来，信任反向代理带的真实 IP
      # Docker 沙盒（电脑）是下面的 computer 容器，服务经共用卷里的这个 unix socket 找它。服务不碰 Docker
      OSA_COMPUTER_SOCKET: /run/osa-computer/computer.sock
    ports:
      # 默认只监听本机。局域网里直接访问可以设 OSA_BIND=0.0.0.0，但要先设 OSA_PASSWORD
      - "${OSA_BIND:-127.0.0.1}:${OSA_PORT:-8765}:8765"
    volumes:
      - ./data:/app/data                     # 数据库、保险库密钥、本机应用清单
      - ./config.yaml:/app/config.yaml:ro    # 改完 docker compose restart 生效
      - cache:/cache                         # npx / uvx 下载的应用，重启后不用重新下载
      - computer-socket:/run/osa-computer    # 和电脑容器共用：里面只有 computerd 的 unix socket
    extra_hosts:
      - host.docker.internal:host-gateway    # 连宿主机上的代理或 Ollama 用这个地址

  # Bot 的电脑（Docker 沙盒）：虚拟桌面 + Chromium + 终端，所有 Bot 共用。常驻运行，闲置时只关掉里面的浏览器。
  # 服务不挂 docker.sock（那等于宿主机的 root），只经 computer-socket 卷里的 unix socket 让这里执行命令、转发画面；
  # 电脑单独一个网络，能上网，但连不到服务。只用云电脑（Instabox）时：docker compose up -d osa（不启动这个）
  computer:
    build:
      context: osa/computer/image
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: osa-computer:1
    pull_policy: never
    init: true
    restart: unless-stopped
    shm_size: 1gb          # Chromium 要
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SCREEN_W: 1280
      SCREEN_H: 800
      OSA_COMPUTER_SOCKET: /run/osa-computer/computer.sock
    volumes:
      - computer-data:/data                  # 工作文件夹、浏览器的登录状态
      - computer-socket:/run/osa-computer
    networks: [computer]

  # 可选：自动申请 HTTPS 证书的反向代理。先把域名解析到这台服务器，设好 OSA_DOMAIN 和 OSA_PASSWORD，
  # 再 docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    environment:
      OSA_DOMAIN: ${OSA_DOMAIN:-}
    command: >-
      sh -c 'if [ -z "$$OSA_DOMAIN" ]; then echo "请在 .env 里设置 OSA_DOMAIN（你的域名）" >&2; exit 1; fi;
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [osa]

networks:
  computer: {}   # 电脑自己一个网络：能上网，和服务、反向代理不在一起

volumes:
  cache:
  caddy:
  computer-socket:
  computer-data:
    name: osa-computer-data   # 和以前服务自己建的电脑卷同名：升级后电脑里的文件和登录状态还在
