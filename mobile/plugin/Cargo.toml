[package]
name = "tauri-plugin-osa-ios"
version = "0.1.0"
description = "Open Super Agent 手机 App 的原生部分（iOS，Swift）"
edition = "2021"
publish = false
links = "tauri-plugin-osa-ios"

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
