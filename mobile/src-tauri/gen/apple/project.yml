# 改了这个文件要在这个目录里跑 `xcodegen generate`。别再跑 `tauri ios init`：它会用模板把这里的改动（通知扩展、权限、文案）冲掉
name: osa-mobile
options:
  bundleIdPrefix: com.kadaliao.opensuperagent
  developmentLanguage: en
  deploymentTarget:
    iOS: 16.0
packages:
  WebPushCrypto:
    path: ../../../swift/WebPushCrypto
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Open Super Agent
      PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.opensuperagent
      DEVELOPMENT_TEAM: HMDAVG9B8J
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  osa-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # App 图标（Icon Composer，和 Mac 版用同一个）：Xcode 26 按它编出 iOS 26 的 Liquid Glass 图标和旧系统用的平面图标，
      # 同名的 Assets.xcassets/AppIcon 不再用到
      - path: ../../../../desktop/src-tauri/icons/AppIcon.icon
        buildPhase: resources
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: osa-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # 推送占位文案、权限说明的中英文（mobile/ios/Resources）
      - path: ../../../ios/Resources
        buildPhase: resources
    info:
      path: osa-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.10.0
        CFBundleVersion: "1"
    entitlements:
      path: osa-mobile_iOS/osa-mobile_iOS.entitlements
      properties:
        aps-environment: development   # 导出 App Store 版时 Xcode 按描述文件换成 production
        com.apple.security.application-groups: [group.com.kadaliao.opensuperagent]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      configs:
        # 发 TestFlight / App Store 的包用手动签名：Apple Distribution 证书和开发者网站上的 App Store 描述文件（mobile/scripts/release-ios.sh）
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Open Super Agent App Store
      groups: [app]
    dependencies:
      - target: NotificationService
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          npm run -- tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  # 通知扩展：推送到了手机上先在这里解密（mobile/ios/NotificationService），钥匙在 App Group 共用的钥匙串里
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../ios/NotificationService
        excludes: ["*.entitlements"]
    info:
      path: ../../../ios/NotificationService/Info.plist   # XcodeGen 按下面的内容生成，别直接改那个文件
      properties:
        CFBundleDisplayName: Open Super Agent
        CFBundleShortVersionString: 0.10.0
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: ../../../ios/NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kadaliao.opensuperagent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.opensuperagent.NotificationService
        PRODUCT_NAME: NotificationService
        DEVELOPMENT_TEAM: HMDAVG9B8J
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        SKIP_INSTALL: true
      configs:
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Open Super Agent NotificationService App Store
    dependencies:
      - package: WebPushCrypto
    postBuildScripts:
      - name: Copy version from the app
        basedOnDependencyAnalysis: false
        script: |
          # 扩展的版本号要和 App 一样（Tauri 只改 App 的 Info.plist），不然上传时会被打回
          app="${PROJECT_DIR}/osa-mobile_iOS/Info.plist"
          ext="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          for k in CFBundleShortVersionString CFBundleVersion; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$app")
            /usr/libexec/PlistBuddy -c "Set :$k $v" "$ext"
          done
