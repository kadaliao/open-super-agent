[package]
name = "osa-mobile"
version = "0.10.0"
description = "Open Super Agent iPhone app"
edition = "2021"
publish = false

[lib]
name = "osa_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-osa-ios = { path = "../plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
sys-locale = "0.3"
