[project]
name = "open-super-agent"
version = "0.6.0"
description = "Self-hosted super agent: Router + parallel Workers + Watchdog (inspired by DeepSeek Super-agent)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "pyyaml",
    "httpx",
    "mcp>=2.3.0",
    "websockets>=17.4",
    "cryptography",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 所有测试共用一个事件循环：Router、群聊的锁是常驻的，换循环会出错
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
