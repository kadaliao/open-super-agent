title: 企业微信日程
category: mail
order: 45
by: 企业微信官方
icon: {glyph: calendar, color: '#0082EF'}
how: 粘贴一个链接
desc: 查日程、建日程、改日程
about: 企业微信官方的连接，通过企业微信里的「智能机器人」授权。Bot 能查看和搜索你的日程，帮你创建、修改和取消日程；改动前会先问你。
can:
- 查看、搜索日程
- 创建、修改、取消日程（先问你）
example: '@wecom-schedule 下周三下午两点建个日程：市场部复盘会，一小时'
steps:
- 在企业微信里打开「工作台」→「智能机器人」→「创建机器人」→「手动创建」，选「API模式创建」，连接方式选「使用长连接」，设好可见范围后保存（建过就跳过）
- 回到「智能机器人」→「管理」，找到这个机器人点「编辑」
- 在「可使用权限」里点「去授权」，把「日程」相关的几项都点「授权」
- 点「日程」右上角的「>」，在「StreamableHttp URL」旁边点「复制」，粘贴到下面
note: 授权 7 天后过期，过期后在企业微信里重新授权，再点「换个密钥」粘贴新复制的链接。超过 10 人的企业里，Bot 以机器人的身份操作，能做的事会少一些。
fields:
- key: url
  label: StreamableHttp URL
  secret: true
  nospace: true
  placeholder: https://qyapi.weixin.qq.com/mcp/…?apikey=…
  pattern: ^https://qyapi\.weixin\.qq\.com/mcp/.*apikey=
  invalid: 要复制的是「StreamableHttp URL」，以 https://qyapi.weixin.qq.com/mcp/ 开头
en:
  title: WeCom Calendar
  by: Official (WeCom)
  how: Paste a link
  desc: View, create, and edit events
  about: WeCom's official connection, authorized through a "Smart bot" (智能机器人) in WeCom. The bot can view and search your events, and create, edit, and cancel events. It asks you before making changes.
  can:
  - View and search events
  - Create, edit, and cancel events (asks first)
  example: '@wecom-schedule create an event next Wednesday at 2 PM: marketing team retrospective, one hour'
  steps:
  - In WeCom, open "Workspace → Smart bot → Create bot → Create manually" (工作台 → 智能机器人 → 创建机器人 → 手动创建), choose "Create in API mode" (API模式创建), set the connection to "Use persistent connection" (使用长连接), choose who can see it, and save (skip if you've done this before)
  - Go back to "Smart bot → Manage" (智能机器人 → 管理), find the bot, and click "Edit" (编辑)
  - Under "Available permissions" (可使用权限), click "Go authorize" (去授权), then click "Authorize" (授权) for each "Calendar" (日程) item
  - Click the ">" at the top right of "Calendar" (日程), click "Copy" (复制) next to "StreamableHttp URL", and paste it below
  note: The authorization expires after 7 days. When it does, authorize again in WeCom, then click "Change key" and paste the newly copied link. In organizations with more than 10 people, the bot acts as the WeCom bot and can do a bit less.
  fields:
    url:
      invalid: Copy the "StreamableHttp URL"; it starts with https://qyapi.weixin.qq.com/mcp/
connect:
  type: http
  url: '{url}'
