desc: 查表、加记录、更新字段
about: Airtable 官方的连接。登录授权时选好允许访问的 base，Bot 就能查询表里的记录，新增和更新记录，写评论；也能看表结构，帮你加字段、建新表。
can:
- 按条件查记录，汇总统计
- 新增、更新记录
- 查看表结构，加字段、建表
example: '@airtable 把今天联系过的三位客户加到「客户」表，状态填「已联系」'
en:
  by: Official (Airtable)
  desc: Query tables, add records, update fields
  about: Airtable's official connection. Choose which bases to allow when you sign in, and the bot can query records, add and update records, and leave comments. It can also read table structure, add fields, and create new tables.
  can:
  - Find records by condition and summarize them
  - Add and update records
  - View table structure, add fields, create tables
  example: '@airtable add the three customers I contacted today to the "Customers" table with status "Contacted"'
deny: [delete]
connect:
  type: http
  url: https://mcp.airtable.com/mcp
  oauth: true
