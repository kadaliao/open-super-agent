title: 高德地图
category: life
order: 10
by: 高德官方
icon: {glyph: pin, color: '#0091FF'}
how: 填一个 Key
desc: 查地点、规划路线、看天气
about: 高德地图官方的远程 MCP。填一个高德 Web 服务 Key，Bot 就能查地点、算路线和时间、看天气。
can:
- 搜索地点、查地址和坐标
- 规划驾车、公交、步行、骑行路线
- 查城市天气
example: '@amap 周六从望京到颐和园，地铁和开车各要多久？'
steps:
- 登录高德开放平台控制台，进入「应用管理 → 我的应用」，新建一个应用
- 给应用「添加 Key」，服务平台选「Web 服务」
- 把生成的 Key 复制到下面
link: https://console.amap.com/dev/key/app
link_label: 打开高德控制台
fields:
- key: key
  label: Web 服务 Key
  secret: true
en:
  title: Amap
  by: Official (Amap)
  how: Needs a key
  desc: Find places, plan routes, check the weather
  about: Amap's official remote MCP. Enter an Amap Web service key, and the bot can look up places, work out routes and travel times, and check the weather.
  can:
  - Search places, look up addresses and coordinates
  - Plan driving, transit, walking, and cycling routes
  - Check city weather
  example: '@amap on Saturday, how long does it take from Wangjing to the Summer Palace by subway and by car?'
  steps:
  - Sign in to the Amap Open Platform console, go to "App management → My apps" (应用管理 → 我的应用), and create an app
  - Click "Add Key" (添加 Key) on the app and choose "Web service" (Web 服务) as the platform
  - Paste the generated key below
  link_label: Open Amap console
  fields:
    key:
      label: Web service key
connect:
  type: http
  url: https://mcp.amap.com/mcp?key={key}
