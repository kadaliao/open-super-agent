desc: 搜知乎和全网内容，看热榜，问知乎直答
about: 知乎官方的连接。Bot 能搜索知乎上的问答和文章、搜全网，看知乎热榜，也能用知乎直答回答问题。只读，不会替你发内容。
can:
- 搜索知乎问答、文章，以及全网内容
- 查看知乎热榜
- 用知乎直答回答问题
example: '@zhihu 知乎上大家怎么评价二手房现在入手？挑几个高赞回答总结一下'
steps:
- 登录知乎开放平台，进入「个人中心」→「概览」
- 在「Access Secret 管理」里点「申请新 Access Secret」→「确认申请」
- 先点「复制」再点「我已保存」（关掉后就看不到了），粘贴到下面
link: https://developer.zhihu.com/
link_label: 打开知乎开放平台
note: 每天有免费额度，做了实名认证额度高很多；超出后按次付费。
fields:
- key: secret
  label: Access Secret
  secret: true
  nospace: true
en:
  title: Zhihu
  by: Official (Zhihu)
  desc: Search Zhihu and the web, see trending topics, ask Zhihu Zhida
  about: Zhihu's official connection. The bot can search Q&As and articles on Zhihu, search the web, see Zhihu's trending list, and answer questions with Zhihu Zhida. Read-only; it won't post anything for you.
  can:
  - Search Zhihu Q&As and articles, and the wider web
  - See Zhihu's trending list
  - Answer questions with Zhihu Zhida
  example: '@zhihu what do people on Zhihu think about buying a resale home right now? Summarize a few top-voted answers'
  steps:
  - Sign in to the Zhihu Open Platform and go to "Personal center → Overview" (个人中心 → 概览)
  - Under "Access Secret management" (Access Secret 管理), click "Request new Access Secret" (申请新 Access Secret) → "Confirm" (确认申请)
  - Click "Copy" (复制), then "I've saved it" (我已保存); you can't see it again after closing. Paste it below
  link_label: Open Zhihu Open Platform
  note: There's a free daily quota, much higher with real-name verification. Beyond that, you pay per call.
connect:
  type: http
  url: https://developer.zhihu.com/api/mcp/v1
  headers:
    Authorization: Bearer {secret}
