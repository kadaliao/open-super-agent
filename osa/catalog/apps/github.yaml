how: 粘贴一个 token
desc: 仓库、issue、PR、代码搜索
about: GitHub 官方的远程 MCP。填一个 Personal access token，Bot 就能读代码、查 issue 和 PR、帮你提 issue。
can:
- 搜索代码、阅读文件
- 查看和新建 issue、PR，写评论
- 查看 Actions 运行结果
example: '@github 看看 kadaliao/open-super-agent 最近一周有哪些新 issue'
steps:
- 打开 GitHub 新建 token 的页面
- 选要授权的仓库和权限（只想让它看，就只给 Read 权限）
- 生成后复制，粘贴到下面
link: https://github.com/settings/personal-access-tokens/new
link_label: 打开 GitHub token 设置
fields:
- key: token
  label: Personal access token
  placeholder: github_pat_……
  secret: true
deny: [delete]
connect:
  type: http
  url: https://api.githubcopilot.com/mcp/
  headers:
    Authorization: Bearer {token}
