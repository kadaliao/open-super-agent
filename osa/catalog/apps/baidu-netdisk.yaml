title: 百度网盘
category: files
order: 30
by: 百度网盘官方
icon: {glyph: cloud, color: '#06A7FF'}
how: 授权后粘贴一段 token
desc: 找文件、整理网盘、生成分享链接
about: 百度网盘官方的连接。Bot 能按名字或意思搜索网盘里的文件，列目录、查看容量，帮你新建文件夹、移动、复制、重命名，从网址保存文件，生成分享链接；改动前会先问你。不能删除文件。
can:
- 按关键词或意思搜索文件，按文档、图片、视频分类列出
- 新建文件夹，移动、复制、重命名文件（先问你）
- 从网址保存文件到网盘，生成分享链接（先问你）
example: '@baidu-netdisk 找一下去年的体检报告 PDF，放到「我的资料」文件夹里'
steps:
- 点下面的按钮打开百度的授权页，扫码或用账号登录
- 两项权限保持勾选，点「授权」
- 页面会跳到一个空白页，地址栏里有「access_token=…」。复制 access_token= 后面、下一个 & 之前的那一段，粘贴到下面
link: https://openapi.baidu.com/oauth/2.0/authorize?response_type=token&client_id=QHOuRXiepJBMjtk0esLhrPoNlQyYd0mF&redirect_uri=oob&scope=basic,netdisk&qrcode=1
link_label: 打开百度授权页
note: 授权 30 天后过期，到期后再点一次上面的按钮授权，然后点「换个密钥」粘贴新的。不想用了可以在百度账号的「授权管理」里解除。
fields:
- key: token
  label: access_token
  secret: true
  nospace: true
  pattern: ^[^:/?&=#]+$
  invalid: 只复制 access_token= 后面那一段，不要整个网址
en:
  title: Baidu Netdisk
  by: Official (Baidu Netdisk)
  how: Authorize, then paste a token
  desc: Find files, organize your drive, create share links
  about: Baidu Netdisk's official connection. The bot can search your files by name or meaning, list folders, check storage, create folders, move, copy, and rename files, save files from a URL, and create share links. It asks you before making changes. It can't delete files.
  can:
  - Search files by keyword or meaning, list them by type (documents, images, videos)
  - Create folders, move, copy, and rename files (asks first)
  - Save files from a URL to your drive, create share links (asks first)
  example: '@baidu-netdisk find last year''s health checkup report PDF and put it in the "My documents" folder'
  steps:
  - Click the button below to open Baidu's authorization page, then scan the QR code or sign in with your account
  - Leave both permissions checked and click "Authorize" (授权)
  - You'll land on a blank page with "access_token=…" in the address bar. Copy the part after access_token= and before the next &, and paste it below
  link_label: Open Baidu authorization page
  note: The authorization expires after 30 days. When it does, click the button above to authorize again, then click "Change key" and paste the new token. To stop using it, revoke access under "Authorization management" (授权管理) in your Baidu account.
  fields:
    token:
      invalid: Copy only the part after access_token=, not the whole URL
deny: [file_del]
confirm: [copy, move, rename, upload, share, make_dir]
connect:
  type: sse
  url: https://mcp-pan.baidu.com/sse
  headers:
    Authorization: Bearer {token}
