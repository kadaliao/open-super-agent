title: DeepWiki
category: dev
order: 20
by: Cognition 官方
icon: {glyph: book, color: '#0F766E'}
desc: 读懂任意公开 GitHub 仓库：架构、模块、用法
about: DeepWiki 为公开的 GitHub 仓库生成了文档。Bot 可以直接问某个仓库是怎么设计的、某个功能在哪实现。
can:
- 查看仓库的文档目录和内容
- 就某个仓库提问，得到带出处的回答
example: '@deepwiki vercel/next.js 的路由缓存是怎么实现的？'
en:
  by: Official (Cognition)
  desc: 'Understand any public GitHub repo: architecture, modules, usage'
  about: DeepWiki has generated docs for public GitHub repos. The bot can ask how a repo is designed or where a feature is implemented.
  can:
  - View a repo's docs outline and content
  - Ask questions about a repo and get answers with sources
  example: '@deepwiki how is the router cache implemented in vercel/next.js?'
connect:
  type: http
  url: https://mcp.deepwiki.com/mcp
