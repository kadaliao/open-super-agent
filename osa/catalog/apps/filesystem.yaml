title: 文件夹
category: files
order: 10
by: MCP 官方
icon: {glyph: folder, color: '#C98A2B'}
desc: 读写服务器上一个指定文件夹里的文件
about: 让 Bot 直接读写服务器上的一个文件夹，比如存放报告、整理资料。只能访问你指定的这个目录。
can:
- 列出、读取、搜索文件
- 新建和修改文件、建文件夹
example: '@filesystem 把这份周报存成 weekly/本周.md'
fields:
- key: path
  label: 允许访问的目录
  default: '{workspace}'
en:
  title: Folder
  by: Official (MCP)
  desc: Read and write files in a chosen folder on the server
  about: Lets the bot read and write a folder on the server directly, for example to store reports or organize materials. It can only access the folder you specify.
  can:
  - List, read, and search files
  - Create and edit files, create folders
  example: '@filesystem save this weekly report as weekly/this-week.md'
  fields:
    path:
      label: Allowed folder
connect:
  type: stdio
  command: npx
  args: [-y, '@modelcontextprotocol/server-filesystem', '{path}']
