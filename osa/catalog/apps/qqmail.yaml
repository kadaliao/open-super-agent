title: QQ 邮箱
category: mail
order: 20
by: IMAP · 社区
icon:
  color: '#1EBAFC'
  svg: M21.395 15.035a40 40 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a39 39 0 0 0-.802 2.264c-1.021 3.283-.69 4.643-.438 4.673.54.065 2.103-2.472 2.103-2.472 0 1.469.756 3.387 2.394 4.771-.612.188-1.363.479-1.845.835-.434.32-.379.646-.301.778.343.578 5.883.369 7.482.189 1.6.18 7.14.389 7.483-.189.078-.132.132-.458-.301-.778-.483-.356-1.233-.646-1.846-.836 1.637-1.384 2.393-3.302 2.393-4.771 0 0 1.563 2.537 2.103 2.472.251-.03.581-1.39-.438-4.673
how: 邮箱 + 一个密码
desc: 读邮件、搜邮件、整理收件箱，替你起草和发送
about: 用 IMAP 连上你的 QQ 邮箱。Bot 能查找、阅读、归档邮件，帮你起草回复；发送和删除前会先问你。
can:
- 按发件人、主题、时间查邮件，读正文和附件
- 归档、移动、标记已读
- 起草、回复、转发、发送（先问你）
example: '@qqmail 看看今天有哪些需要我回复的邮件，帮我起草回复'
steps:
- 网页版 QQ 邮箱：设置 → 账号与安全 → 安全设置
- 开启「IMAP/SMTP 服务」，按提示验证后会给你一个授权码
- 把授权码复制到下面（不是 QQ 密码）
link: https://wx.mail.qq.com/
link_label: 打开 QQ 邮箱
fields:
- key: email
  label: 邮箱地址
  placeholder: you@example.com
  pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
  invalid: 邮箱地址的格式不对
- key: password
  label: 授权码
  secret: true
  nospace: true
check:
  imap:
    host: imap.qq.com
    user: '{email}'
    password: '{password}'
    hint: 注意填的是授权码，不是平时的登录密码
en:
  title: QQ Mail
  by: IMAP · Community
  how: Email + password
  desc: Read and search email, tidy your inbox, draft and send for you
  about: Connects to your QQ Mail over IMAP. The bot can find, read, and archive email and draft replies. It asks you before sending or deleting.
  can:
  - Find email by sender, subject, or date; read bodies and attachments
  - Archive, move, mark as read
  - Draft, reply, forward, send (asks first)
  example: '@qqmail which emails today need a reply from me? Draft replies for them'
  steps:
  - In QQ Mail on the web, go to "Settings → Account & security → Security settings" (设置 → 账号与安全 → 安全设置)
  - Turn on "IMAP/SMTP service" (IMAP/SMTP 服务). After you verify as prompted, you'll get an authorization code
  - Paste the authorization code below (not your QQ password)
  link_label: Open QQ Mail
  fields:
    email:
      label: Email address
      invalid: That doesn't look like an email address
    password:
      label: Authorization code
  check:
    imap:
      hint: Use the authorization code, not your regular sign-in password
deny: [email_command]
connect:
  type: stdio
  command: uvx
  args: [mcp-email-server@latest, stdio]
  env:
    MCP_EMAIL_SERVER_EMAIL_ADDRESS: '{email}'
    MCP_EMAIL_SERVER_PASSWORD: '{password}'
    MCP_EMAIL_SERVER_IMAP_HOST: imap.qq.com
    MCP_EMAIL_SERVER_IMAP_PORT: '993'
    MCP_EMAIL_SERVER_SMTP_HOST: smtp.qq.com
    MCP_EMAIL_SERVER_SMTP_PORT: '465'
    # 收件人不限制：发送前 OSA 自己会弹确认卡片
    MCP_EMAIL_SERVER_ALLOWED_RECIPIENTS: '*'
