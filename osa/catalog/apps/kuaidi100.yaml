title: 快递100
category: life
order: 30
by: 快递100官方
icon: {glyph: package, color: '#FF6A00'}
desc: 查快递到哪了，估运费和送达时间
about: 快递100官方的连接。Bot 能按单号查快递的物流轨迹（不知道是哪家快递也能自动识别），估算寄件运费和预计送达时间。只能查，不能下单寄件。
can:
- 按单号查物流轨迹，自动识别快递公司
- 估算寄件运费
- 估算预计送达时间
example: '@kuaidi100 帮我查一下这个单号到哪了：SF1234567890123'
steps:
- 在快递100 API 开放平台注册账号（表单要填企业名称和手机号）
- 登录后点右上角「管理后台」
- 在「授权参数」里找到「授权key」，点旁边的眼睛图标显示出来，复制粘贴到下面（不是 customer）
link: https://api.kuaidi100.com/register
link_label: 打开快递100 API 开放平台
note: 注册后有免费试用额度，用完要充值。
fields:
- key: key
  label: 授权key
  secret: true
  nospace: true
en:
  title: Kuaidi100
  by: Official (Kuaidi100)
  desc: Track packages, estimate shipping costs and delivery times
  about: Kuaidi100's official connection. The bot can track a package by its tracking number (it detects the carrier automatically), and estimate shipping costs and delivery times. It can only look things up, not book shipments.
  can:
  - Track packages by number, detect the carrier automatically
  - Estimate shipping costs
  - Estimate delivery times
  example: "@kuaidi100 where's this package now: SF1234567890123"
  steps:
  - Sign up on the Kuaidi100 API Open Platform (the form asks for a company name and a phone number)
  - After signing in, click "Admin console" (管理后台) at the top right
  - Under "Authorization parameters" (授权参数), find "Authorization key" (授权key), click the eye icon next to it to reveal it, and paste it below (not the customer value)
  link_label: Open Kuaidi100 API platform
  note: New accounts get a free trial quota. After it runs out, you need to top up.
  fields:
    key:
      label: Authorization key
connect:
  type: http
  url: https://api.kuaidi100.com/mcp/streamable?key={key}
