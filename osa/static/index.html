<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Super Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--mut:#77756f;--card:#fff;--acc:#2f5d50;--line:#e3e1db}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#99978f;--card:#20201e;--acc:#7fb8a4;--line:#2e2e2b}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg);display:flex;height:100vh}
main{flex:1;display:flex;flex-direction:column;min-width:0}#log{flex:1;overflow:auto;padding:24px max(16px,calc(50% - 380px))}
.m{margin:10px 0;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.user{background:transparent;border-color:transparent;text-align:right;color:var(--acc)}.task{font-size:13px;color:var(--mut)}.error{color:#c0392b}
form{display:flex;gap:8px;padding:12px max(16px,calc(50% - 380px));border-top:1px solid var(--line)}
textarea{flex:1;resize:none;height:48px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
button{padding:0 18px;border:0;border-radius:8px;background:var(--acc);color:var(--bg);font-weight:600;cursor:pointer}
aside{width:280px;border-left:1px solid var(--line);padding:16px;overflow:auto;font-size:13px}aside h3{margin:0 0 10px;font-size:13px;color:var(--mut)}
.t{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--card)}.s{font-weight:600}
.running .s{color:#c8902a}.done .s{color:var(--acc)}.failed .s,.cancelled .s{color:#c0392b}
nav{display:flex;gap:4px;margin-bottom:12px}nav a{padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--mut)}nav a.on{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.big{font-size:26px;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h4{margin:14px 0 6px;font-size:12px;color:var(--mut);font-weight:600}.bars{display:flex;align-items:flex-end;gap:2px;height:60px}.bars div{flex:1;background:var(--acc);min-height:1px;border-radius:2px 2px 0 0}
.ap{border:1px solid #c8902a;background:var(--card);border-radius:10px;padding:12px 14px;margin:10px 0}.ap pre{background:var(--bg);padding:8px;border-radius:6px;font-size:12px;max-height:240px}
.ap .act{display:flex;gap:8px;margin-top:8px}.ap input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.ap button.no{background:transparent;color:#c0392b;border:1px solid #c0392b}.ap .st{color:var(--mut);font-size:13px}
@media(max-width:800px){aside{display:none}}pre{overflow:auto}
</style></head><body>
<main><div id="log"></div>
<form id="f"><textarea id="q" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea><button>发送</button></form></main>
<aside><nav><a data-p="tasks" class="on">任务</a><a data-p="cost">费用</a><a data-p="ext">触发与插件</a></nav>
<div class="p" id="p-tasks"><div id="tasks"></div></div>
<div class="p" id="p-cost" hidden></div><div class="p" id="p-ext" hidden></div></aside>
<script>
const log=document.getElementById('log'),tasks=document.getElementById('tasks'),q=document.getElementById('q');
let ws;function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
ws.onmessage=e=>{const d=JSON.parse(e.data);d.type==='message'?add(d.role,d.content):d.type==='approval'?approval(d):task(d)};ws.onclose=()=>setTimeout(connect,1500)}
function add(role,text){const el=document.createElement('div');el.className='m '+role;el.innerHTML=marked.parse(text||'');log.appendChild(el);log.scrollTop=log.scrollHeight}
const AST={approved:'✅ 已允许',rejected:'❌ 已拒绝',expired:'⌛ 超时未确认，已按拒绝处理',cancelled:'任务已取消'};
function approval(d){let el=document.getElementById('a'+d.id);
 if(d.status==='pending'){if(el)return;el=document.createElement('div');el.id='a'+d.id;el.className='ap';
  el.innerHTML=`<div>⚠️ <b>任务 #${d.task_id} 想执行写操作</b>：<code>${esc(d.tool)}</code></div><div class="st">${esc(d.goal)}</div><pre>${esc(d.args)}</pre>
  <div class="act"><input placeholder="意见（可选，例如：标题改成…）"><button class="ok">允许</button><button class="no">拒绝</button></div>`;
  const send=ok=>ws.send(JSON.stringify({approve:d.id,ok,note:el.querySelector('input').value}));
  el.querySelector('.ok').onclick=()=>send(true);el.querySelector('.no').onclick=()=>send(false);log.appendChild(el);log.scrollTop=log.scrollHeight;return}
 if(el){const a=el.querySelector('.act');if(a)a.outerHTML=`<div class="st">${AST[d.status]||d.status}</div>`}}
function task(d){let el=document.getElementById('t'+d.id);if(!el){el=document.createElement('div');el.id='t'+d.id;tasks.prepend(el);el.innerHTML=`<div>#${d.id} ${d.mode==='heavy'?'⚡Heavy ':''}<span class="s"></span></div><div class="g"></div>`}
el.className='t '+d.status;el.querySelector('.s').textContent=d.status+(d.elapsed?` · ${d.elapsed}s`:'');if(d.goal)el.querySelector('.g').textContent=d.goal.slice(0,80);
if(d.result&&d.status!=='running')add('assistant',`**任务 #${d.id} ${d.status==='done'?'完成':d.status}**\n\n`+d.result)}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(t){ws.send(JSON.stringify({text:t}));q.value=''}};
const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x===a));
document.querySelectorAll('.p').forEach(p=>p.hidden=p.id!=='p-'+a.dataset.p);refresh()});
const row=(a,b)=>`<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
async function refresh(){
 if(!$('p-cost').hidden){const u=await (await fetch('/api/usage')).json(),c=u.currency,f=v=>c+v.toFixed(v<1?3:2);
  const mx=Math.max(...u.by_day.map(d=>d.cost),1e-9);
  $('p-cost').innerHTML=`<div class="big">${f(u.today.cost)}</div><div style="color:var(--mut)">今天 · ${u.today.calls} 次调用 · 缓存命中 ${(u.today.cache_rate*100).toFixed(0)}%</div>
  ${row('近 7 天',f(u.week.cost))}${row('近 30 天',f(u.month.cost))}
  <h4>近 30 天每日</h4><div class="bars">${u.by_day.map(d=>`<div title="${d.day} ${f(d.cost)}" style="height:${d.cost/mx*100}%"></div>`).join('')}</div>
  <h4>按角色（30 天）</h4>${u.by_role.map(r=>row(r.role+' · '+r.model,f(r.cost))).join('')||'暂无'}
  <h4>按任务</h4>${u.by_task.map(t=>row('#'+t.id+' '+t.goal,f(t.cost))).join('')||'暂无'}`}
 if(!$('p-ext').hidden){const s=await (await fetch('/api/status')).json();
  $('p-ext').innerHTML=`<h4>MCP 插件</h4>${Object.entries(s.mcp).map(([k,v])=>row(k,v)).join('')||'未配置'}
  <h4>定时任务</h4>${(s.routines||[]).map(t=>row(t.name+' ('+t.trigger+')',t.enabled?'启用':'暂停')).join('')}
  <h4>最近触发</h4>${s.trigger_log.map(l=>row(l.ts+' '+l.trigger+'：'+l.detail,l.verdict)).join('')||'暂无'}`}}
setInterval(refresh,8000);
q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit()}};connect();
</script></body></html>
