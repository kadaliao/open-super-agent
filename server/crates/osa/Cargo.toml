[package]
name = "osa"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "osa-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4.45"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
futures = "0.3"
encoding_rs = "0.8"
fancy-regex = "0.14"
flate2 = "1"
indexmap = "2"
libc = "0.2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2.0.5"
parking_lot = "0.12.5"
rand = "0.8"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "query", "rustls", "form", "multipart", "http2"] }
rmcp = { version = "3.11.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip：小数读回来和写出去的一模一样。不开的话 serde_json 读小数可能差最后一位，时间戳存成 JSON 再读回来就对不上原来那条了（撤销整理记忆时撞到过）
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rustls = "0.23"
rustls-platform-verifier = "0.7"
tokio-rustls = "0.26"
roxmltree = "0.20"
sha1 = "0.10"
similar = "2"
open-agent-docs = "0.4.0"
html-escape = "0.2"
aes = "0.8"
async-trait = "0.1"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8", "pem"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
chrono-tz = "0.10"
mailparse = "0.16"
